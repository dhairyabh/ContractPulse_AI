spring.application.name=contractpulse-api
server.port=8080
spring.datasource.url=jdbc:h2:mem:contractpulse;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.sql.init.mode=always
spring.jackson.serialization.write-dates-as-timestamps=false

# ML Risk Model Configuration
contractpulse.ml.python-path=${PYTHON_PATH:python}
contractpulse.ml.script-path=${ML_SCRIPT_PATH:}
contractpulse.ml.timeout-seconds=${ML_TIMEOUT_SECONDS:15}
